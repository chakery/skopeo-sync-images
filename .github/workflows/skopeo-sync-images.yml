name: Sync Docker Images To Registries

on:
  workflow_dispatch:
  push:
    paths:
      - images.txt
      - .github/workflows/skopeo-sync-images.yml

permissions:
  contents: read

jobs:
  check:
    name: Validate configuration
    runs-on: ubuntu-latest
    env:
      TARGETS: ${{ vars.SYNC_TARGETS }}
    steps:
      - name: Check SYNC_TARGETS
        run: |
          set -o errexit
          set -o pipefail

          if [ -z "${TARGETS:-}" ]; then
            echo "::error::Repository variable SYNC_TARGETS is not set."
            echo "::error::Create it under Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi

          if ! jq -e 'type == "array" and length > 0' >/dev/null <<<"$TARGETS"; then
            echo "::error::SYNC_TARGETS must be a non-empty JSON array, e.g."
            echo "::error::  [{\"env\":\"acr\",\"host\":\"registry.cn-hangzhou.aliyuncs.com\",\"namespace\":\"team-a\"}]"
            exit 1
          fi

          problems=""
          count="$(jq 'length' <<<"$TARGETS")"
          index=0
          while [ "$index" -lt "$count" ]; do
            item="$(jq -c ".[$index]" <<<"$TARGETS")"
            env_name="$(jq -r '.env // empty' <<<"$item")"
            host="$(jq -r '.host // empty' <<<"$item")"
            namespace="$(jq -r '.namespace // ""' <<<"$item")"

            if [ -z "$env_name" ]; then
              problems="${problems}  item ${index}: missing 'env' (the GitHub Environment name)\n"
            elif [ -z "$host" ]; then
              problems="${problems}  item ${index} (${env_name}): missing 'host'\n"
            else
              echo "  ${env_name} -> ${host}/${namespace}"
            fi
            index=$((index + 1))
          done

          if [ -n "$problems" ]; then
            echo -e "::error::Invalid entries in SYNC_TARGETS:\n${problems}"
            exit 1
          fi

          echo "Validated ${count} target(s)."

  sync:
    name: Sync to ${{ matrix.target.env }}
    needs: check
    runs-on: ubuntu-latest
    permissions: {}
    # 每个 registry 一个 Environment，其中的 USER / PASS 两条 secret 由该
    # registry 独有。凭证不写进 matrix —— matrix 里的 secret 会在日志脱敏
    # 生效前被插入 job metadata，泄漏到 run 的 job 列表中。
    environment: ${{ matrix.target.env }}
    strategy:
      # 单个 registry 失败不影响其余，Re-run failed jobs 可只重跑失败的
      fail-fast: false
      # 限制同时占用的 runner 并发配额，避免对 Docker Hub 发起过量拉取
      max-parallel: 4
      matrix:
        target: ${{ fromJSON(vars.SYNC_TARGETS) }}
    env:
      TARGET_HOST: ${{ matrix.target.host }}
      TARGET_NAMESPACE: ${{ matrix.target.namespace }}
      REG_USER: ${{ secrets.USER }}
      REG_PASS: ${{ secrets.PASS }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login and sync images
        run: |
          set -o errexit
          set -o pipefail

          if [ -z "$REG_USER" ] || [ -z "$REG_PASS" ]; then
            echo "::error::This environment's USER / PASS secrets are missing or empty."
            echo "::error::Settings -> Environments -> <name> -> Environment secrets."
            exit 1
          fi

          # 字面量引用的 secret 值 GitHub 会自动脱敏，这里再注册一次作为双保险
          printf '::add-mask::%s\n::add-mask::%s\n' "$REG_USER" "$REG_PASS"

          # --- 读取镜像清单 ---
          # 用 while read 而非 mapfile：后者是 bash 4+ 才有，macOS 自带 bash 3.2 跑不了，
          # 本地调试会直接报错。行为与 mapfile 在 ubuntu runner 上完全一致。
          IMAGES=()
          while IFS= read -r line; do
            IMAGES+=("$line")
          done < <(
            awk '
              { sub(/\r$/, "", $0) }
              /^[[:space:]]*#/ { next }
              /^[[:space:]]*$/ { next }
              { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $0); print }
            ' images.txt
          )

          if [ "${#IMAGES[@]}" -eq 0 ]; then
            echo "::error::No active images found in images.txt."
            exit 1
          fi

          # --- 目标仓库前缀 ---
          if [ -n "$TARGET_NAMESPACE" ]; then
            dest_repo="${TARGET_HOST}/${TARGET_NAMESPACE}/"
          else
            dest_repo="${TARGET_HOST}/"
          fi

          echo "Target : ${TARGET_HOST} (${dest_repo})"
          echo "Images : ${#IMAGES[@]}"

          # 密码走 stdin，不进 argv（ps 可见）
          printf '%s' "$REG_PASS" \
            | skopeo login "$TARGET_HOST" --username "$REG_USER" --password-stdin

          # --- 逐个同步 ---
          # --scoped 保留源镜像的完整路径，否则 apache/dubbo-admin 会被截成 dubbo-admin
          failed=()
          for image in "${IMAGES[@]}"; do
            echo ""
            echo "=== docker.io/${image} -> ${dest_repo} ==="
            # 捕获输出：失败时直接打印，否则 skopeo 的错误详情会被日志折叠挡住，
            # 只看得到 FAIL 而看不到原因。
            if sync_output="$(skopeo sync --all --scoped --src docker --dest docker \
                                 "docker.io/${image}" "${dest_repo}" 2>&1)"; then
              echo "${sync_output}"
              echo "OK   ${image}"
            else
              echo "${sync_output}"
              echo "FAIL ${image}"
              failed+=("$image")
            fi
          done

          # --- 汇总 ---
          echo ""
          if [ "${#failed[@]}" -ne 0 ]; then
            echo "::error::${#failed[@]} image(s) failed: ${failed[*]}"
            exit 1
          fi

          echo "All ${#IMAGES[@]} image(s) synced."
