name: Sync Docker Images To Registries

on:
  workflow_dispatch:
  push:
    paths:
      - images.txt
      - .github/workflows/skopeo-sync-images.yml

permissions:
  contents: read

jobs:
  sync:
    name: Sync to ${{ matrix.target.id }}
    runs-on: ubuntu-latest
    permissions: {}
    strategy:
      # 单个 registry 失败不影响其余，Re-run failed jobs 可只重跑失败的
      fail-fast: false
      # 限制同时占用的 runner 并发配额，避免对 Docker Hub 发起过量拉取
      max-parallel: 4
      matrix:
        include:
          # 新增一个 registry：
          #   1) 在下面加一段
          #   2) 创建对应的两条 secret：SYNC_<id>_USER 和 SYNC_<id>_PASS
          #
          # host 只能写 registry 域名，不要带 scheme 和路径。
          # namespace 可留空（个人版可用），企业版必填。
          # 凭证必须字面量引用。不要把 secrets 上下文整体序列化取出，
          # GitHub 会判定为可能恶意的 workflow 并阻止运行、要求人工审批。
          - id: ACR
            host: registry.cn-hangzhou.aliyuncs.com
            namespace: docker_hub_mirrors
            user: ${{ secrets.SYNC_ACR_USER }}
            pass: ${{ secrets.SYNC_ACR_PASS }}

          - id: ACR_KR
            host: crpi-k3h5kqabkjc5s4qt.cn-guangzhou.personal.cr.aliyuncs.com
            namespace: kr-images
            user: ${{ secrets.SYNC_ACR_KR_USER }}
            pass: ${{ secrets.SYNC_ACR_KR_PASS }}

          # 腾讯云 TCR 示例（namespace 是 12 位数字实例 ID，要加引号）：
          # - id: TCR_SH
          #   host: ccr.ccs.tencentyun.com
          #   namespace: "100012345678"
          #   user: ${{ secrets.SYNC_TCR_SH_USER }}
          #   pass: ${{ secrets.SYNC_TCR_SH_PASS }}
    env:
      TARGET_ID: ${{ matrix.target.id }}
      TARGET_HOST: ${{ matrix.target.host }}
      TARGET_NAMESPACE: ${{ matrix.target.namespace }}
      TARGET_USER: ${{ matrix.target.user }}
      TARGET_PASS: ${{ matrix.target.pass }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login and sync images
        run: |
          set -o errexit
          set -o pipefail

          if [ -z "$TARGET_USER" ] || [ -z "$TARGET_PASS" ]; then
            echo "::error::Secret SYNC_${TARGET_ID}_USER / SYNC_${TARGET_ID}_PASS is missing or empty."
            echo "::error::Create it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          # 字面量引用的 secret 值 GitHub 会自动脱敏，这里再注册一次作为双保险
          printf '::add-mask::%s\n::add-mask::%s\n' "$TARGET_USER" "$TARGET_PASS"

          # --- 读取镜像清单 ---
          # 用 while read 而非 mapfile：后者是 bash 4+ 才有，macOS 自带 bash 3.2 跑不了，
          # 本地调试会直接报错。行为与 mapfile 在 ubuntu runner 上完全一致。
          IMAGES=()
          while IFS= read -r line; do
            IMAGES+=("$line")
          done < <(
            awk '
              { sub(/\r$/, "", $0) }
              /^[[:space:]]*#/ { next }
              /^[[:space:]]*$/ { next }
              { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $0); print }
            ' images.txt
          )

          if [ "${#IMAGES[@]}" -eq 0 ]; then
            echo "::error::No active images found in images.txt."
            exit 1
          fi

          # --- 目标仓库前缀 ---
          if [ -n "$TARGET_NAMESPACE" ]; then
            dest_repo="${TARGET_HOST}/${TARGET_NAMESPACE}/"
          else
            dest_repo="${TARGET_HOST}/"
          fi

          echo "Target : ${TARGET_ID} (${dest_repo})"
          echo "Images : ${#IMAGES[@]}"

          # 密码走 stdin，不进 argv（ps 可见）
          printf '%s' "$TARGET_PASS" \
            | skopeo login "$TARGET_HOST" --username "$TARGET_USER" --password-stdin

          # --- 逐个同步 ---
          # --scoped 保留源镜像的完整路径，否则 apache/dubbo-admin 会被截成 dubbo-admin
          failed=()
          for image in "${IMAGES[@]}"; do
            echo ""
            echo "::group::docker.io/${image} -> ${dest_repo}"
            if skopeo sync --all --scoped --src docker --dest docker \
                 "docker.io/${image}" "${dest_repo}"; then
              echo "::endgroup::"
              echo "OK   ${image}"
            else
              echo "::endgroup::"
              echo "FAIL ${image}"
              failed+=("$image")
            fi
          done

          # --- 汇总 ---
          echo ""
          if [ "${#failed[@]}" -ne 0 ]; then
            echo "::error::${#failed[@]} image(s) failed: ${failed[*]}"
            exit 1
          fi

          echo "All ${#IMAGES[@]} image(s) synced to ${TARGET_ID}."
