# 目标 registry 清单
#
# 本文件可公开，不含任何凭证。凭证统一放在 GitHub Secret SYNC_CREDS 中，
# 格式为 JSON，键名与这里的 id 一一对应：
#
#   {
#     "ACR":      { "user": "<登录用户名>", "pass": "<密码>" },
#     "ACR_KR":   { "user": "<登录用户名>", "pass": "<密码>" }
#   }
#
# <id> 必须是大写字母、数字、下划线。
#
# 新增一个 registry：
#   1) 在下面 targets 里加一条
#   2) 在 secret SYNC_CREDS 里加对应的键
#   —— workflow 文件无需改动。

targets:
  - id: ACR
    host: registry.cn-hangzhou.aliyuncs.com
    namespace: docker_hub_mirrors

  - id: ACR_KR
    host: crpi-k3h5kqabkjc5s4qt.cn-guangzhou.personal.cr.aliyuncs.com
    namespace: kr-images

  # 腾讯云 TCR 示例（namespace 是 12 位数字实例 ID，必须加引号）：
  # - id: TCR_SH
  #   host: ccr.ccs.tencentyun.com
  #   namespace: "100012345678"
